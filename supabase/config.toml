# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "dealfairway"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://app.dealfairway.ca/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
